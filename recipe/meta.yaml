{% set name = "phidl" %}
{% set version = "1.7.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/phidl-{{ version }}.tar.gz
  sha256: 9cda9fdf52035b11b27ab58e165bd627ebabe8f5f4d1c6764861830c36cf7896

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - gdspy >=1.5
    - matplotlib-base
    - numpy
    - python >={{ python_min }}
    - six

test:
  imports:
    - phidl
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/phidl/
  doc_url: https://phidl.readthedocs.io/en/latest/tutorials.html
  summary: PHIDL
  license: MIT
  # License file manually packaged. See https://github.com/amccaugh/phidl/pull/86
  license_file: LICENSE

extra:
  recipe-maintainers:
    - joamatab
